name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    # Oldest supported runner: the binary then needs only glibc >= 2.35
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      - run: cargo build --release
      - run: gh release create "$GITHUB_REF_NAME" target/release/fanatec-tuning Fanatec-Tuning.desktop --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
