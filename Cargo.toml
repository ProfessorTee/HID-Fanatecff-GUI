[package]
name = "fanatec-tuning"
version = "2.0.0"
edition = "2024"

[dependencies]
egui = { version = "0.34", default-features = false, features = ["default_fonts"] }
egui_software_backend = "0.0.3"
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"] }
libc = "0.2.191"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
